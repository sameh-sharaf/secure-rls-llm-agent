name: eval

# The gate that matters, split by what each half can actually promise.
#
# `boundary` is deterministic: it fires real cross-tenant reads at the query
# gateway with no model and no prompt in the picture, and it is the job that
# gates. It is also the honest one -- this project's whole argument is that a
# safety property must not depend on the model behaving, so the check that
# enforces it should not depend on the model either.
#
# `model_sweep` measures answer quality and refusal behaviour across models.
# That is worth knowing and is not a security gate, so it runs on demand
# rather than nightly. It used to run on a schedule and was cancelled at the
# 60-minute timeout every time: an 8B model on a CPU-only GitHub runner needs
# roughly four model calls per case across eighty cases, which does not fit in
# an hour and never did. A scheduled job that always cancels teaches people to
# ignore the eval badge.

on:
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: Ollama model to evaluate
        default: llama3.1:8b
      limit:
        description: Cases per suite (keep it small on a CPU runner)
        default: "12"

jobs:
  # ---------------------------------------------------------------- the gate
  boundary:
    name: boundary (deterministic, no model)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build fixtures
        run: |
          python scripts/generate_data.py
          python scripts/build_db.py

      # Exits non-zero unless every single-layer arm blocks and the naive arm
      # leaks. Both halves matter: a harness that stops disabling anything
      # reports a confident all-green, which is how it silently measured
      # nothing once already.
      - name: Ablation probe
        run: python -m evals.ablation

      - name: Boundary and contract suites
        run: pytest tests/test_boundary.py tests/test_tool_contract.py
                    tests/test_column_policy.py tests/test_ablation_harness.py -q

  # ------------------------------------------------- quality, run on request
  model_sweep:
    name: model sweep (needs a live model)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 180
    env:
      SECURE_RLS_MODEL: ${{ github.event.inputs.model || 'llama3.1:8b' }}
      CASE_LIMIT: ${{ github.event.inputs.limit || '12' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache the Ollama model
        uses: actions/cache@v5
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.SECURE_RLS_MODEL }}

      - name: Start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull "$SECURE_RLS_MODEL"

      - name: Build fixtures
        run: |
          python scripts/generate_data.py
          python scripts/build_db.py
          python scripts/build_index.py

      - name: Red-team suite
        run: |
          python -m evals.runner --suite redteam --limit "$CASE_LIMIT" \
            --out evals/results/redteam.json --quiet

      - name: Correctness suite
        if: always()
        run: |
          python -m evals.runner --suite correctness --limit "$CASE_LIMIT" \
            --out evals/results/correctness.json --quiet || true

      - name: Render the report
        if: always()
        run: |
          python -m evals.report evals/results/*.json >> "$GITHUB_STEP_SUMMARY"

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v5
        with:
          name: eval-results
          path: evals/results/

name: eval

# The gate that matters. A leak rate above zero fails the build, and there is
# no override: a security property that is not continuously tested is an
# aspiration, and one that can be waved through is not a property at all.

on:
  pull_request:
  schedule:
    - cron: "0 3 * * *"
  workflow_dispatch:
    inputs:
      model:
        description: Ollama model to evaluate
        default: llama3.1:8b

jobs:
  redteam:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      SECURE_RLS_MODEL: ${{ github.event.inputs.model || 'llama3.1:8b' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Cache the Ollama model
        uses: actions/cache@v4
        with:
          path: ~/.ollama/models
          key: ollama-${{ env.SECURE_RLS_MODEL }}

      - name: Start Ollama
        run: |
          curl -fsSL https://ollama.com/install.sh | sh
          ollama serve &
          sleep 5
          ollama pull "$SECURE_RLS_MODEL"

      - name: Build fixtures
        run: |
          python scripts/generate_data.py
          python scripts/build_db.py
          python scripts/build_index.py

      - name: Red-team suite
        id: redteam
        run: |
          python -m evals.runner --suite redteam \
            --out evals/results/redteam.json --quiet

      - name: Correctness suite
        if: always()
        run: |
          python -m evals.runner --suite correctness \
            --out evals/results/correctness.json --quiet || true

      - name: Render the report
        if: always()
        run: |
          python -m evals.report evals/results/*.json >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const body = fs.readFileSync('evals/results/report.md', 'utf8');
            github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: evals/results/

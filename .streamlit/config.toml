# Streamlit paints its own header and toolbar before the script runs, so any
# CSS injected from Python arrives too late to hide the busy indicator on a
# cold load -- and app startup here takes a few seconds (imports, listing local
# models), which is exactly when it is most visible.
#
# `toolbarMode = "minimal"` removes that chrome server-side, from the first
# paint, so there is no window for it to appear in. The CSS in app.py still
# handles the in-page spinner during a rerun.
[client]
toolbarMode = "minimal"
showErrorDetails = true

[browser]
gatherUsageStats = false

[theme]
# Pinned rather than left to the viewer, because `toolbarMode = "minimal"`
# above also removes the hamburger menu that Streamlit puts its theme switcher
# in. Hiding the busy indicator and hiding the settings menu are the same
# switch, so the theme has to be decided here. To change it, edit this block.
base = "dark"
primaryColor = "#7B92FF"
backgroundColor = "#0E1116"
secondaryBackgroundColor = "#161A21"
textColor = "#E4E7EC"

[server]
# The demo runs locally against a local model; nothing here should be reaching
# out, and file watching restarts the app under the user mid-question.
fileWatcherType = "none"
